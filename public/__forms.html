<!-- Static form skeleton for Netlify Forms build-time detection -->
<html>
  <body>
    <form name="domain-leads" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="domain-leads" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
